<span class="icon">
  {% if include.url %}
    <a rel="me" href="{{ social.url }}" target="_blank" title="{{ social.name }}">
      <i class="{{ site.data.icons[include.icon] | join: ' ' }}"></i>
      <span>{{ include.value }}</span>
    </a>
  {% else %}
    <i class="{{ site.data.icons[include.icon] | join: ' ' }}"></i>
    <span>{{ include.value }}</span>
  {% endif %}
</span>
