{% if include.url %}
  <a rel="me" href="{{ include.url }}" target="_blank" title="{{ include.name }}" class="icon">
    <i class="{{ site.data.icons[include.icon] | join: ' ' }}"></i>
    {% if include.value %}
      <span>{{ include.value }}</span>
    {% endif %}
  </a>
{% else %}
  <span class="icon">
    <i class="{{ site.data.icons[include.icon] | join: ' ' }}"></i>
    {% if include.value %}
      <span>{{ include.value }}</span>
    {% endif %}
  </span>
{% endif %}
