<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <title>
      {% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{
      site.description }}
    </title>

    <link
      rel="stylesheet"
      type="text/css"
      href="{{ site.baseurl }}/assets/styles.css"
    />
  </head>

  <body>
    <main class="page-content" aria-label="Content">
      <div class="wrapper">{{ content }}</div>
    </main>
  </body>
</html>
