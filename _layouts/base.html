<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <title>
      {% if page.title %}{{ page.title }} – {% endif -%}
      {{- site.name }} – {{ site.description }}
    </title>

    <link
      rel="stylesheet"
      type="text/css"
      href="{{ site.baseurl }}/assets/styles.css"
    />
  </head>

  <body>
    {{ content }}
  </body>
</html>
